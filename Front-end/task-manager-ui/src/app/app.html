<app-login *ngIf="!currentUser" (loggedIn)="onLoggedIn($event)"></app-login>

<main class="app-shell" *ngIf="currentUser">
  <header class="app-header">
    <div>
      <p class="eyebrow">Task Management System</p>
      <h1>{{ currentUser.role }} Workspace</h1>
    </div>

    <div class="user-summary">
      <span>{{ currentUser.name }}</span>
      <small>{{ currentUser.email }}</small>
      <small *ngIf="currentUser.companyName">{{ currentUser.companyName }}</small>
      <div class="header-actions">
        <app-notifications></app-notifications>
        <button type="button" (click)="logout()">Logout</button>
      </div>
    </div>
  </header>

  <nav class="view-tabs" aria-label="Workflow views">
    <button
      *ngIf="canAccess('supervisor-dashboard')"
      type="button"
      [class.active]="activeView === 'supervisor-dashboard'"
      (click)="setActiveView('supervisor-dashboard')"
    >
      Task Tracking
    </button>
    <button
      *ngIf="canAccess('register')"
      type="button"
      [class.active]="activeView === 'register'"
      (click)="setActiveView('register')"
    >
      Register User
    </button>
    <button
      *ngIf="canAccess('task-create')"
      type="button"
      [class.active]="activeView === 'task-create'"
      (click)="setActiveView('task-create')"
    >
      Create Task
    </button>
    <button
      *ngIf="canAccess('tl-dashboard')"
      type="button"
      [class.active]="activeView === 'tl-dashboard'"
      (click)="setActiveView('tl-dashboard')"
    >
      TL Dashboard
    </button>
    <button
      *ngIf="canAccess('developer-dashboard')"
      type="button"
      [class.active]="activeView === 'developer-dashboard'"
      (click)="setActiveView('developer-dashboard')"
    >
      Developer Dashboard
    </button>
    <button
      *ngIf="canAccess('user-management')"
      type="button"
      [class.active]="activeView === 'user-management'"
      (click)="setActiveView('user-management')"
    >
      User Management
    </button>
    <button
      *ngIf="canAccess('change-password')"
      type="button"
      [class.active]="activeView === 'change-password'"
      (click)="setActiveView('change-password')"
    >
      Change Password
    </button>
  </nav>

  <section class="view-panel">
    <app-supervisor-dashboard
      *ngIf="activeView === 'supervisor-dashboard' && canAccess('supervisor-dashboard')"
      [currentUser]="currentUser"
    ></app-supervisor-dashboard>
    <app-register
      *ngIf="activeView === 'register' && canAccess('register')"
      [currentUser]="currentUser"
    ></app-register>
    <app-task-create
      *ngIf="activeView === 'task-create' && canAccess('task-create')"
      [currentUser]="currentUser"
    ></app-task-create>
    <app-tl-dashboard
      *ngIf="activeView === 'tl-dashboard' && canAccess('tl-dashboard')"
      [currentUser]="currentUser"
    ></app-tl-dashboard>
    <app-developer-dashboard
      *ngIf="activeView === 'developer-dashboard' && canAccess('developer-dashboard')"
      [currentUser]="currentUser"
    ></app-developer-dashboard>
    <app-user-management
      *ngIf="activeView === 'user-management' && canAccess('user-management')"
      [currentUser]="currentUser"
    ></app-user-management>
    <app-change-password
      *ngIf="activeView === 'change-password' && canAccess('change-password')"
    ></app-change-password>
  </section>
</main>
