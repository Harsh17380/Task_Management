<main class="app-shell">
  <header class="app-header">
    <div>
      <p class="eyebrow">Task Management System</p>
      <h1>Role Workflow</h1>
    </div>
  </header>

  <nav class="view-tabs" aria-label="Workflow views">
    <button
      type="button"
      [class.active]="activeView === 'register'"
      (click)="setActiveView('register')"
    >
      Register User
    </button>
    <button
      type="button"
      [class.active]="activeView === 'task-create'"
      (click)="setActiveView('task-create')"
    >
      Create Task
    </button>
    <button
      type="button"
      [class.active]="activeView === 'tl-dashboard'"
      (click)="setActiveView('tl-dashboard')"
    >
      TL Dashboard
    </button>
    <button
      type="button"
      [class.active]="activeView === 'developer-dashboard'"
      (click)="setActiveView('developer-dashboard')"
    >
      Developer Dashboard
    </button>
  </nav>

  <section class="view-panel">
    <app-register *ngIf="activeView === 'register'"></app-register>
    <app-task-create *ngIf="activeView === 'task-create'"></app-task-create>
    <app-tl-dashboard *ngIf="activeView === 'tl-dashboard'"></app-tl-dashboard>
    <app-developer-dashboard *ngIf="activeView === 'developer-dashboard'"></app-developer-dashboard>
  </section>
</main>
