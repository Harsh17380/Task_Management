<div class="notification-wrapper">
  <!-- Bell button -->
  <button
    type="button"
    class="bell-btn"
    (click)="togglePanel()"
    [attr.aria-label]="'Notifications' + (unreadCount > 0 ? ', ' + unreadCount + ' unread' : '')"
    [class.has-unread]="unreadCount > 0"
  >
    <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown panel -->
  <div class="notif-panel" *ngIf="isOpen" role="dialog" aria-label="Notifications">
    <div class="panel-header">
      <h3>Notifications</h3>
      <button
        type="button"
        class="mark-all-btn"
        *ngIf="unreadCount > 0"
        (click)="markAllRead()"
      >
        Mark all read
      </button>
    </div>

    <div class="notif-filter" *ngIf="notifications.length > 0">
      <button type="button" [class.active]="typeFilter === ''" (click)="typeFilter = ''">All</button>
      <button type="button" [class.active]="typeFilter === 'NEW_COMMENT'" (click)="typeFilter = 'NEW_COMMENT'">Comments</button>
      <button type="button" [class.active]="typeFilter === 'TASK_ASSIGNED'" (click)="typeFilter = 'TASK_ASSIGNED'">Tasks</button>
      <button type="button" [class.active]="typeFilter === 'SUBTASK_ASSIGNED'" (click)="typeFilter = 'SUBTASK_ASSIGNED'">Subtasks</button>
      <button type="button" [class.active]="typeFilter === 'TASK_STATUS'" (click)="typeFilter = 'TASK_STATUS'">Status</button>
    </div>

    <p class="empty-state" *ngIf="filteredNotifications.length === 0">
      No notifications yet.
    </p>

    <ul class="notif-list" *ngIf="filteredNotifications.length > 0">
      <li
        *ngFor="let n of filteredNotifications"
        class="notif-item"
        [class.unread]="!n.isRead"
        (click)="markRead(n, $event)"
      >
        <span class="notif-icon" aria-hidden="true">{{ typeLabel(n.type) }}</span>
        <div class="notif-body">
          <p class="notif-msg">{{ n.message }}</p>
          <time class="notif-time">{{ timeAgo(n.createdAt) }}</time>
        </div>
        <span class="unread-dot" *ngIf="!n.isRead" aria-label="Unread"></span>
      </li>
    </ul>
  </div>
</div>
