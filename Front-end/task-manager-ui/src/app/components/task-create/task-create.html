<section class="form-panel">
  <h2>Create Task</h2>

  <form class="form-grid" (ngSubmit)="createTask()">
    <label>
      Title
      <input name="title" [(ngModel)]="task.title" placeholder="Title">
    </label>

    <label>
      Description
      <input name="description" [(ngModel)]="task.description" placeholder="Description">
    </label>

    <div class="form-row">
      <label>
        Due Date
        <input name="dueDate" type="date" [(ngModel)]="task.dueDate">
      </label>

      <label>
        Priority
        <select name="priority" [(ngModel)]="task.priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="URGENT">Urgent</option>
        </select>
      </label>
    </div>

    <label>
      Team Lead
      <select name="assignedTo" [(ngModel)]="task.assignedTo">
        <option value="" disabled>Select team lead</option>
        <option *ngFor="let tl of tls" [value]="tl.id">
          {{ tl.name }}
        </option>
      </select>
    </label>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating...' : 'Create Task' }}
    </button>
  </form>

  <p class="message" *ngIf="message">{{ message }}</p>
</section>
