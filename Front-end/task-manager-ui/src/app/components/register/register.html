<section class="form-panel">
  <p class="eyebrow">{{ isSuperAdmin ? 'Platform Administration' : currentUser?.companyName }}</p>
  <h2>{{ isSuperAdmin ? 'Create Company Administrator' : 'Create Company User' }}</h2>

  <form class="form-grid" (ngSubmit)="createUser()">
    <label>
      Name
      <input name="name" [(ngModel)]="user.name" placeholder="Name">
    </label>

    <label>
      Email
      <input name="email" [(ngModel)]="user.email" placeholder="Email">
    </label>

    <label>
      Password
      <input name="password" type="password" [(ngModel)]="user.password" placeholder="Password">
    </label>

    <label *ngIf="isSuperAdmin">
      Company Name
      <input name="companyName" [(ngModel)]="user.companyName" placeholder="Unique company name">
    </label>

    <label *ngIf="!isSuperAdmin">
      Role
      <select name="role" [(ngModel)]="user.role">
        <option value="" disabled>Select role</option>
        <option value="SUPERVISOR">Supervisor</option>
        <option value="MANAGER">Manager</option>
        <option value="TL">Team Lead</option>
        <option value="DEVELOPER">Developer</option>
      </select>
    </label>

    <label *ngIf="isSuperAdmin">
      Role
      <span class="locked-value">Company Administrator</span>
    </label>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating...' : (isSuperAdmin ? 'Create Company' : 'Create User') }}
    </button>
  </form>

  <p class="message" [ngClass]="messageType" *ngIf="message">{{ message }}</p>

</section>
