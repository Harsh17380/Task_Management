<section class="change-password-page">

  <div class="panel">

    <div class="panel-header">
      <div>
        <p class="eyebrow">Security</p>
        <h2>Change Password</h2>
      </div>
    </div>

    <div class="form-grid">

      <label>
        Old Password
        <input
          type="password"
          [(ngModel)]="oldPassword"
          placeholder="Enter old password"
        />
      </label>

      <label>
        New Password
        <input
          type="password"
          [(ngModel)]="newPassword"
          placeholder="Enter new password"
        />
      </label>

    </div>

    <button
      type="button"
      (click)="changePassword()"
      [disabled]="loading"
    >
      {{ loading ? 'Updating...' : 'Change Password' }}
    </button>

    <p class="message success" *ngIf="message">
      {{ message }}
    </p>

    <p class="message error" *ngIf="error">
      {{ error }}
    </p>

  </div>

</section>
