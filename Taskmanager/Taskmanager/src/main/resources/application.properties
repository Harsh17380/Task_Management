spring.application.name=Taskmanager
server.port=${PORT:8080}

# PostgreSQL / Supabase datasource
# Replace the placeholders below with your actual Supabase credentials.
# In Supabase: Project Settings -> Database -> Connection string (JDBC)
# Format: jdbc:postgresql://<host>:5432/<dbname>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tweaks (Supabase free tier has limited connections)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

logging.level.root=INFO
logging.level.com.TaskManager.Taskmanager=DEBUG

spring.jpa.show-sql=true
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.autoconfigure.mail=TRACE

# Secret must be at least 32 characters (256 bits) for HS256
jwt.secret=taskmanager-super-secret-key-12345678-abcdef
# Token expiry: 24 hours in milliseconds
jwt.expiration=86400000


